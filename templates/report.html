{% extends "base.html" %}
{% block title %}Project Report{% endblock %}
{% block content %}
<section class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div>
      <p class="font-mono text-xs uppercase tracking-wider text-rust mb-3">Project Report</p>
      <h1 class="font-display text-3xl sm:text-4xl">Technical Support for Rural Startups</h1>
    </div>
    <div class="flex gap-2">
      <a href="{{ url_for('report_file') }}" target="_blank" rel="noopener"
         class="px-4 py-2 rounded-md border border-charcoal/30 text-sm font-medium hover:bg-charcoal/5">Open in new tab</a>
      <a href="{{ url_for('download_report') }}"
         class="px-4 py-2 rounded-md bg-amber-500 hover:bg-amber-400 text-indigo-950 text-sm font-semibold">&#8681; Download PDF</a>
    </div>
  </div>

  <div class="rounded-lg overflow-hidden border border-charcoal/20 bg-white" style="height:80vh;min-height:520px">
    <object data="{{ url_for('report_file') }}#view=FitH" type="application/pdf" class="w-full h-full">
      <div class="p-8 text-center text-charcoal/80">
        <p class="mb-4">Your browser can't show the PDF here (common on phones).</p>
        <a href="{{ url_for('report_file') }}" target="_blank" rel="noopener" class="underline font-medium">Open the report</a>
        &middot;
        <a href="{{ url_for('download_report') }}" class="underline font-medium">Download it</a>
      </div>
    </object>
  </div>
</section>
{% endblock %}
